<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" fill="none" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
.hn{fill:#f0f6fc;font-size:46px;font-weight:700;letter-spacing:-1px;animation:hin 1.2s ease-out both}
.ht{fill:#c9d1d9;font-size:14.5px}.ht i{fill:#484f58;font-style:normal}
.hc{fill:#9da7b3;font-size:15px}
.hsub{font-size:15px;font-weight:600;letter-spacing:3.6px;animation:hin 1.2s .25s ease-out both}
.hu{animation:hun 5s ease-in-out infinite}
@keyframes hun{0%,100%{width:44px}50%{width:112px}}
.hty{animation:hty 10s infinite}
@keyframes hty{0%{width:0;animation-timing-function:steps(54,end)}24%,90%{width:470px}100%{width:0}}
.htag{font-size:13.5px;letter-spacing:.5px}
.hl{fill:#8b949e;font-size:11px;font-family:hM;letter-spacing:1.8px;animation:hhl 5s infinite}
@keyframes hin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes hhl{0%,70%,100%{fill:#6e7681}8%,22%{fill:#58a6ff}}
@keyframes htw{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes hrot{to{transform:rotate(360deg)}}
@keyframes hfl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hsw{from{stroke-dashoffset:0}to{stroke-dashoffset:-1840}}
.hs{animation:htw 3s infinite}.ho{animation:hfl 6s ease-in-out infinite}
.hr{transform-box:fill-box;transform-origin:center;animation:hrot 24s linear infinite}
.hb{stroke-dasharray:180 1660;animation:hsw 6s linear infinite}
</style>
<defs>
<radialGradient id="hog" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#4f6bb8"/><stop offset=".45" stop-color="#1a2348"/><stop offset="1" stop-color="#0d1117"/></radialGradient>
<linearGradient id="hlg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
<linearGradient id="hbg" x1="0" x2="1"><stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
<linearGradient id="htg" x1="0" x2="1"><stop offset="0" stop-color="#f0f6fc"/><stop offset="1" stop-color="#79c0ff"/></linearGradient>
<linearGradient id="hsh" gradientUnits="userSpaceOnUse" x1="38" y1="0" x2="438" y2="0"><stop offset="0" stop-color="#8b949e"/><stop offset=".4" stop-color="#8b949e"/><stop offset=".5" stop-color="#e6edf3"/><stop offset=".6" stop-color="#8b949e"/><stop offset="1" stop-color="#8b949e"/><animateTransform attributeName="gradientTransform" type="translate" from="-420 0" to="460 0" dur="4.5s" repeatCount="indefinite"/></linearGradient>
<pattern id="hdp" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#21262d"/></pattern>
<clipPath id="htc"><rect class="hty" x="36" y="157" width="470" height="22"/></clipPath>
</defs>
<rect x=".5" y=".5" width="859" height="249" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="858" height="248" rx="14" fill="url(#hdp)"/>
<rect class="hb" x="1" y="1" width="858" height="248" rx="14" stroke="url(#hbg)" stroke-width="2"/>
<g class="hs"><circle cx="560" cy="40" r="1.3" fill="#fff"/><circle cx="620" cy="205" r="1.1" fill="#fff" style="animation-delay:.8s"/><circle cx="830" cy="150" r="1.3" fill="#fff" style="animation-delay:1.6s"/><circle cx="760" cy="30" r="1" fill="#fff" style="animation-delay:2.2s"/><circle cx="520" cy="120" r="1" fill="#fff" style="animation-delay:1.2s"/></g>
<g class="ho">
<circle cx="700" cy="125" r="62" fill="url(#hog)" stroke="#2f3f6e"/>
<ellipse class="hr" cx="700" cy="125" rx="74" ry="26" stroke="#388bfd" stroke-opacity=".55" stroke-dasharray="3 5" transform="rotate(-20 700 125)"/>
<g transform="rotate(-20 700 125)"><circle r="3.6" fill="#79c0ff"><animateMotion dur="7s" repeatCount="indefinite" path="M626 125a74 26 0 1 0 148 0a74 26 0 1 0 -148 0"/></circle></g>
</g>
<path d="M600 222L792 36" stroke="url(#hlg)" stroke-width="1.2"/>
<circle r="3" fill="#a5d6ff"><animateMotion dur="4s" repeatCount="indefinite" path="M600 222L792 36"/></circle>
<circle cx="792" cy="36" r="3.5" fill="#79c0ff"/>
<g><text x="790" y="82" class="hl">LLMs</text><text x="790" y="108" class="hl" style="animation-delay:1s">RAG</text><text x="790" y="134" class="hl" style="animation-delay:2s">MCP</text><text x="790" y="160" class="hl" style="animation-delay:3s">TOOLS</text><text x="790" y="186" class="hl" style="animation-delay:4s">IMPACT</text></g>
<text x="36" y="92" class="hn">Sudharshan N</text>
<text x="38" y="134" class="hsub" fill="url(#htg)">AI &amp; FULL STACK DEVELOPER</text>
<rect class="hu" x="38" y="144" width="44" height="2" rx="1" fill="url(#hbg)"/>
<g clip-path="url(#htc)"><text x="38" y="172" class="htag" fill="url(#hsh)">Innovating at the Intersection of Data &amp; Development</text></g>
<g stroke="#8b949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
<g transform="translate(0,21)"><path d="M44 177.500a6 6 0 0 1 6 6c0 4.500-6 10-6 10s-6-5.500-6-10a6 6 0 0 1 6-6z"/><circle cx="44" cy="183.500" r="2.100"/></g>
<g transform="translate(-12,19)"><path d="M226 187l10-5.500 10 5.500-10 5.500zM230 189.500v4.500c3.200 2.400 7.800 2.400 11 0v-4.500M246 187v5.500"/></g>
</g>
<text x="58" y="212" class="hc">Coimbatore, India</text>
<text x="242" y="212" class="hc">B.Tech AI &amp; DS · KPRIET</text>
</svg>